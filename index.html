<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valtiatar Rosan BDSM-joulukalenteri 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0608; color: #e8d5c4; font-family: 'Cormorant Garamond', serif; min-height: 100vh; }
header { text-align: center; padding: 50px 20px 30px; border-bottom: 2px solid #8b0000; }
h1 { font-family: 'Playfair Display', serif; font-size: 2.8em; color: #d4af37; }
.subtitle { font-style: italic; font-size: 1.3em; color: #c9a87c; margin-top: 8px; }
.calendar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; max-width: 980px; margin: 30px auto; padding: 20px; }
.door { background: linear-gradient(160deg, #1a0e14, #0d070a); border: 2px solid #6b2030; border-radius: 12px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 1.9em; font-weight: bold; color: #d4af37; cursor: pointer; transition: all 0.3s; }
.door:hover { transform: translateY(-5px) scale(1.04); border-color: #d4af37; box-shadow: 0 8px 25px rgba(212,175,55,0.2); }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; align-items: center; justify-content: center; }
.modal-content { background: #120a0e; border: 2px solid #8b0000; border-radius: 16px; max-width: 680px; width: 92%; max-height: 90vh; overflow-y: auto; padding: 28px; }
.modal h2 { font-family: 'Playfair Display', serif; color: #d4af37; margin-bottom: 12px; }
.close { float: right; font-size: 2.2em; cursor: pointer; color: #d4af37; }
.media { margin: 16px 0; }
audio, video { width: 100%; border-radius: 8px; }
.pdf-link { display: inline-block; margin-top: 10px; padding: 8px 16px; background: #8b0000; color: #fff; text-decoration: none; border-radius: 6px; }
footer { text-align: center; padding: 40px; color: #6a5048; }
</style>
</head>
<body>
<header>
  <h1>Valtiatar Rosan Joulukalenteri</h1>
  <p class="subtitle">Orjan 24 päivän antautuminen</p>
</header>
<div class="calendar" id="calendar"></div>
<footer>Valtiatar Rosalle • 2026</footer>
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>
<script>
const days = [
  { day: 1, title: "1. Luukku – Antautuminen", content: "Valtiatar Rosa odottaa. Polvistu ja antaudu." },
  { day: 2, title: "2. Luukku – Shibari", content: "Rosa sitoo orjan. Köydet kiristyvät kauniisti." },
  { day: 3, title: "3. Luukku – Sähkö", content: "Rosa ottaa sähkölelut esiin. Pieni kipu, suuri kontrolli." },
  { day: 4, title: "4. Luukku – Siveysvyö", content: "Rosa lukitsee siveysvyön. Orjan nautinto on hänen hallussaan." },
  { day: 5, title: "5. Luukku – Lateksi", content: "Rosa lateksissa. Orja ihailee ja palvelee." },
  { day: 6, title: "6. Luukku – Palvelus", content: "Orja palvelee Rosaa. Hänen nautintonsa on tärkeintä." },
  { day: 7, title: "7. Luukku – Ruoska", content: "Rosa käyttää ruoskaa. Orja laskee iskut." },
  { day: 8, title: "8. Luukku – Pegging", content: "Rosa ottaa kontrollin. Orja antautuu kokonaan." },
  { day: 9, title: "9. Luukku – Hiljaisuus", content: "Orja ei puhu. Rosa puhuu. Kuuntele." },
  { day: 10, title: "10. Luukku – Shibari 2", content: "Monimutkaisempi sidonta. Orja on koriste." },
  { day: 11, title: "11. Luukku – Sähkö 2", content: "Vahvempi sähkö. Orja kestää Rosan puolesta." },
  { day: 12, title: "12. Luukku – Siveys 2", content: "Siveysvyö pysyy. Rosa päättää milloin se avataan." },
  { day: 13, title: "13. Luukku – Kipu", content: "Rosa antaa kipua. Orja kiittää." },
  { day: 14, title: "14. Luukku – Palvonta", content: "Orja palvoo Rosan jalkoja." },
  { day: 15, title: "15. Luukku – Lateksi 2", content: "Orja pukeutuu lateksiin Rosan käskystä." },
  { day: 16, title: "16. Luukku – Sidonta", content: "Orja on sidottu pitkään. Rosa katsoo." },
  { day: 17, title: "17. Luukku – Käsky", content: "Rosa antaa käskyn. Orja tottelee välittömästi." },
  { day: 18, title: "18. Luukku – Nöyryytys", content: "Rosa nöyryyttää. Orja hyväksyy." },
  { day: 19, title: "19. Luukku – Kestävyys", content: "Pitkä sessio. Orja kestää Rosan iloksi." },
  { day: 20, title: "20. Luukku – Lahja", content: "Orja on lahja Rosalle. Käytä häntä." },
  { day: 21, title: "21. Luukku – Shibari 3", content: "Kaunein sidonta. Orja on taideteos." },
  { day: 22, title: "22. Luukku – Siveys 3", content: "Viimeiset päivät siveydessä. Rosa päättää." },
  { day: 23, title: "23. Luukku – Odotus", content: "Huomenna on jouluaatto. Orja odottaa Rosan tahtoa." },
  { day: 24, title: "24. Luukku – Antautuminen", content: "Jouluaatto. Orja antautuu kokonaan Valtiatar Rosalle." }
];

const calendar = document.getElementById('calendar');
days.forEach(d => {
  const door = document.createElement('div');
  door.className = 'door';
  door.textContent = d.day;
  door.onclick = () => openDoor(d);
  calendar.appendChild(door);
});

function openDoor(d) {
  document.getElementById('modal-title').textContent = d.title;
  let html = '<p>' + d.content + '</p><div class="media" id="media-' + d.day + '"></div>';
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
  loadMedia(d.day);
}

function loadMedia(day) {
  const container = document.getElementById('media-' + day);
  const base = 'luukku' + day;
  const audio = new Audio(base + '.mp3');
  audio.oncanplay = () => { container.innerHTML += '<audio controls src="' + base + '.mp3"></audio>'; };
  audio.onerror = () => {};
  const video = document.createElement('video');
  video.src = base + '.mp4';
  video.oncanplay = () => { video.controls = true; video.style.width = '100%'; container.appendChild(video); };
  video.onerror = () => {};
  fetch(base + '.pdf', { method: 'HEAD' }).then(r => {
    if (r.ok) container.innerHTML += '<a class="pdf-link" href="' + base + '.pdf" target="_blank">Avaa PDF</a>';
  }).catch(() => {});
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }
window.onclick = (e) => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
